# FraudLens configuration. Every run is reproducible from this file plus the data.

seed: 42

data:
  path: data/raw/creditcard.csv
  # EV-1: chronological split. The final slice is the test set, used exactly once.
  split:
    train: 0.6
    validation: 0.2
    test: 0.2
  split_index_path: data/processed/split_indices.json

paths:
  artifacts: artifacts
  reports: reports
  readme: README.md

# EV-7: cost model, in dollars.
costs:
  # A missed fraud costs the transaction amount ("amount"), or a fixed number.
  missed_fraud: amount
  # A false alarm costs one manual review.
  false_alarm: 5.0
  # A correctly flagged fraud is reviewed too; set to 0 to ignore review cost on hits.
  caught_fraud: 5.0

evaluation:
  bootstrap_samples: 1000
  confidence: 0.95
  recall_at_precision: 0.90
  precision_at_recall: 0.80
  calibration_bins: 10

# FR-8: randomised search on the validation slice. Budgets are the number of
# parameter settings tried per model; each is trained on train and scored by
# validation PR-AUC.
search:
  metric: average_precision
  logistic_regression:
    n_iter: 6
    space:
      sampling: [class_weight, undersample, smote]
      C: [0.001, 0.01, 0.1, 1.0, 10.0]
  random_forest:
    n_iter: 4
    space:
      sampling: [class_weight]
      n_estimators: [150, 250]
      max_depth: [8, 12, 16, null]
      min_samples_leaf: [1, 3, 5]
      max_features: [sqrt, 0.3]
  hist_gradient_boosting:
    n_iter: 8
    space:
      sampling: [class_weight, none]
      learning_rate: [0.03, 0.05, 0.1]
      max_iter: [200, 400]
      max_leaf_nodes: [15, 31, 63]
      min_samples_leaf: [20, 50, 100]
      l2_regularization: [0.0, 1.0, 10.0]
  isolation_forest:
    n_iter: 4
    space:
      n_estimators: [200, 400]
      max_samples: [256, 1024, 4096]
      max_features: [0.5, 1.0]

# EV-5: every supervised model is refitted with its best parameters under each
# imbalance strategy and compared on validation PR-AUC.
imbalance:
  strategies: [class_weight, undersample, smote]
  models: [logistic_regression, random_forest, hist_gradient_boosting]
  undersample_ratio: 0.1   # minority/majority ratio after undersampling
  smote_ratio: 0.1         # minority/majority ratio after SMOTE

# FR-9: calibration of the chosen model, fitted on validation data.
calibration:
  method: sigmoid  # isotonic overfits with ~100 validation frauds

explain:
  permutation_repeats: 5
  top_k: 5
