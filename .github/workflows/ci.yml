name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_evaluation:
        description: "Run the full train + evaluate on the real dataset"
        type: boolean
        default: false
      data_url:
        description: "URL of creditcard.csv (checked against the SHA-256 in data/README.md)"
        type: string
        default: "https://storage.googleapis.com/download.tensorflow.org/data/creditcard.csv"

env:
  DATA_SHA256: 76274b691b16a6c49d3f159c883398e03ccd6d1ee12d9d8ee38f4b4b98551a89

jobs:
  check:
    name: Lint, types, tests (synthetic fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy fraudlens service
      - name: Tests with coverage (fail under 85%)
        run: uv run pytest --cov=fraudlens --cov=service --cov-report=term-missing

  dashboard:
    name: Dashboard (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: dashboard/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker-smoke:
    name: Docker image serves the API and dashboard
    needs: [check, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Train on the synthetic fixture
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from fraudlens.config import load_config
          from fraudlens.evaluate import evaluate
          from fraudlens.train import train
          from tests.conftest import write_small_config
          path = write_small_config(Path("smoke"))
          cfg = load_config(path)
          train(cfg, path.read_text(encoding="utf-8"))
          evaluate(cfg)
          PY
      - run: docker build -f service/Dockerfile -t fraudlens-api .
      - name: Run and probe
        run: |
          docker run -d --name api -p 8000:8000 -v "$PWD/smoke/artifacts:/artifacts:ro" --read-only --tmpfs /tmp fraudlens-api
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/dashboard/ | grep -q "<title>FraudLens</title>"
          curl -fsS localhost:8000/dashboard/threshold | grep -q 'id="root"'
          curl -fsS localhost:8000/api/dashboard | python3 -c "import json,sys; assert json.load(sys.stdin)['schema_version'] == 1"
          curl -fsS -X POST localhost:8000/score -H 'content-type: application/json' \
            -d @service/presets/example_transaction.json | python3 -c "import json,sys; assert json.load(sys.stdin)['decision'] in ('flag','allow')"
          test "$(docker exec api id -u)" = "10001"
      - if: failure()
        run: docker logs api

  full-evaluation:
    name: Full evaluation on the real dataset
    if: github.event_name == 'workflow_dispatch' && inputs.full_evaluation
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Download dataset
        run: |
          mkdir -p data/raw
          curl -fsSL -o data/raw/creditcard.csv "${{ inputs.data_url }}"
          echo "${DATA_SHA256}  data/raw/creditcard.csv" | sha256sum --check
      - name: Train and evaluate
        run: uv run python -m fraudlens
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
