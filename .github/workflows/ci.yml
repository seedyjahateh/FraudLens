name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_evaluation:
        description: "Run the full train + evaluate on the real dataset"
        type: boolean
        default: false
      data_url:
        description: "URL of creditcard.csv (checked against the SHA-256 in data/README.md)"
        type: string
        default: "https://storage.googleapis.com/download.tensorflow.org/data/creditcard.csv"

env:
  DATA_SHA256: 76274b691b16a6c49d3f159c883398e03ccd6d1ee12d9d8ee38f4b4b98551a89

jobs:
  check:
    name: Lint, types, tests (synthetic fixture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy fraudlens service
      - name: Tests with coverage (fail under 85%)
        run: uv run pytest --cov=fraudlens --cov=service --cov-report=term-missing

  full-evaluation:
    name: Full evaluation on the real dataset
    if: github.event_name == 'workflow_dispatch' && inputs.full_evaluation
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - name: Download dataset
        run: |
          mkdir -p data/raw
          curl -fsSL -o data/raw/creditcard.csv "${{ inputs.data_url }}"
          echo "${DATA_SHA256}  data/raw/creditcard.csv" | sha256sum --check
      - name: Train and evaluate
        run: uv run python -m fraudlens
      - uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
